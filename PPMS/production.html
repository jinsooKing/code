<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPMS - 생산</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="production.css">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmdohyeon.css" rel="stylesheet">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmjua.css" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header class="main-header">
            <div class="header-left"><a href="index.html"><picture><source srcset="logo.avif" type="image/avif"><img src="logo.png" alt="필리아텔레콤 로고" class="header-logo"></picture></a></div>
            <div class="header-center"><div class="common-box font-35pt">생산(SMD)</div></div>
            <div class="header-right"><div class="common-box font-15pt time-display" id="current-time"></div></div>
        </header>

        <main class="content-area">
            <div id="schedule-display-area"></div>
        </main>

        <footer class="main-footer">
            <div class="footer-left">
                <a href="production_schedule_reg.html">
                    <div class="common-box font-15pt clickable-box">
                        생산일정등록
                    </div>
                </a>
            </div>
            <div class="footer-center"><div class="common-box font-15pt">(주)필리아텔레콤</div></div>
            <div class="footer-right"></div>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const dayOfMonth = today.getDate();
            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
            const currentWeekNumber = Math.ceil((dayOfMonth + firstDayOfMonth) / 7);
            const storageKey = `week-${currentYear}-${currentMonth + 1}-${currentWeekNumber}`;
            const savedData = JSON.parse(sessionStorage.getItem(storageKey)) || [];
            
            const displayArea = document.getElementById('schedule-display-area');

            displayArea.innerHTML = createScheduleTableHTML(savedData);
            
            // 테이블이 생성된 후에 날짜 선택 메뉴를 채웁니다.
            const weekInfo = { year: currentYear, month: currentMonth + 1, weekNum: currentWeekNumber };
            populateDateSelectorsForProductionPage(weekInfo);
        });

        function createScheduleTableHTML(schedules) {
            const schedulesByLine = { A: [], B: [], C: [] };
            // 데이터가 있을 때만 그룹화 진행
            if (schedules.length > 0) {
                schedules.forEach(schedule => {
                    if (schedulesByLine[schedule.line]) {
                        schedulesByLine[schedule.line].push(schedule);
                    }
                });
            }

            let tableHTML = '';
            for (const line in schedulesByLine) {
                tableHTML += `
                    <section class="line-schedule-section">
                        <div class="line-header">
                            <h3 class="line-title">${line}라인</h3>
                        </div>`;
                
                if (schedulesByLine[line].length > 0) {
                    tableHTML += `
                        <div class="table-container">
                            <table class="editable-table">
                                <thead>
                                    <tr>
                                        <th>생산라인</th><th>담당자</th><th>업체</th><th>모델명</th><th>T/B</th><th>실생산</th><th>LOT</th><th>생산시작일</th><th>생산종료일</th><th>생산예정일</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${schedulesByLine[line].map(s => `
                                        <tr>
                                            <td class="line-cell">${s.line}</td>
                                            <td><input type="text" class="form-input"></td>
                                            <td>${s.company}</td>
                                            <td>${s.model}</td>
                                            <td>
                                                <select class="form-select">
                                                    <option>Top</option>
                                                    <option>Bottom</option>
                                                    <option>Top Only</option>
                                                    <option>Bottom Only</option>
                                                </select>
                                            </td>
                                            <td><input type="text" class="form-input"></td>
                                            <td>${s.lot}</td>
                                            <td><select class="form-select prod-start-date"></select></td>
                                            <td><select class="form-select prod-end-date"></select></td>
                                            <td>${s.startDate} ~ ${s.endDate}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                } else {
                    tableHTML += `<p class="no-line-data-message">${line}라인은 등록된 생산 일정이 없습니다.</p>`;
                }
                
                tableHTML += `</section>`;
            }
            return tableHTML;
        }

        function populateDateSelectorsForProductionPage(weekInfo) {
            const weekdays = getWeekdaysForWeek(weekInfo.year, weekInfo.month - 1, weekInfo.weekNum);
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            
            const allStartDateSelects = document.querySelectorAll('.prod-start-date');
            const allEndDateSelects = document.querySelectorAll('.prod-end-date');

            // [수정] '-' 옵션을 추가하는 로직
            const createOption = (value, text) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = text;
                return option;
            };

            allStartDateSelects.forEach(select => {
                select.innerHTML = '';
                select.appendChild(createOption('-', '-')); // '-' 옵션 추가
                weekdays.forEach(item => {
                    const optionText = `${item.month}/${item.day}(${dayNames[item.dayOfWeek]})`;
                    select.appendChild(createOption(optionText, optionText));
                });
            });

            allEndDateSelects.forEach(select => {
                select.innerHTML = '';
                select.appendChild(createOption('-', '-')); // '-' 옵션 추가
                weekdays.forEach(item => {
                    const optionText = `${item.month}/${item.day}(${dayNames[item.dayOfWeek]})`;
                    select.appendChild(createOption(optionText, optionText));
                });
            });
        }
        
        function getWeekdaysForWeek(year, month, weekNum) {
            const weekdays = [];
            const firstDateOfMonth = new Date(year, month, 1);
            const firstDayOfWeek = firstDateOfMonth.getDay();
            let date = new Date(firstDateOfMonth);
            date.setDate(date.getDate() - firstDayOfWeek);
            date.setDate(date.getDate() + (weekNum - 1) * 7);
            for (let i = 0; i < 7; i++) {
                const currentDate = new Date(date);
                currentDate.setDate(date.getDate() + i);
                const dayOfWeek = currentDate.getDay();
                if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                    weekdays.push({
                        year: currentDate.getFullYear(),
                        month: currentDate.getMonth() + 1,
                        day: currentDate.getDate(),
                        dayOfWeek: dayOfWeek
                    });
                }
            }
            return weekdays;
        }

        function updateTime() {
            const timeDisplay = document.getElementById('current-time');
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const formattedTime = `${year}년 ${month}월 ${day}일 ${hours}시 ${minutes}분`;
            timeDisplay.textContent = formattedTime;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
